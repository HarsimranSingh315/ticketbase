<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}TicketBase{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232E5C4C'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23F7F8F4' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div class="shell {% block shell_class %}{% endblock %}">
        <header class="site-header">
            <div>
                <a href="/" class="wordmark">TicketBase</a>
                <p class="tagline">Support ticket ledger</p>
            </div>
            {% if user %}
            <nav class="user-bar" aria-label="Main">
                <span class="user-name">{{ user.name }} <span class="user-role">({{ user.role.value }})</span></span>
                <a href="/reports" class="user-link">Reports</a>
                <a href="/kb" class="user-link">Knowledge base</a>
                <a href="/calls" class="user-link">Calls</a>
                {% if user.role.value == 'admin' %}<a href="/admin/users" class="user-link">Users</a>{% endif %}
                <a href="/account/password" class="user-link">Account</a>
                <form method="post" action="/logout" class="inline-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="link-button">Log out</button>
                </form>
            </nav>
            {% endif %}
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/app.js?v=1" defer></script>
</body>
</html>
